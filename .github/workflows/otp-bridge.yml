name: OTP Bridge Review
on:
  pull_request:
  push:
    branches: [codex/otp-bridge-v1]
permissions:
  contents: read
concurrency:
  group: otp-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run types
      - run: git diff --exit-code -- src/worker-configuration.d.ts
      - run: npm run check
      - run: npm run test:all
      - run: npm audit --audit-level high
      - run: npm run build
      - name: Verify generated binding and feature default
        run: node scripts/assert-otp-review-build.mjs
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.2
          run_install: false
      - name: Checkout reviewed MailVault implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: takovn2/mailvault
          ref: f8af0fb0b801e79479b4102bd48cfd4ce300aaa6
          path: mailvault-contract
          persist-credentials: false
      - name: Install companion dependencies
        run: pnpm --dir mailvault-contract install --frozen-lockfile
      - name: Native named-RPC integration
        env:
          MAILVAULT_REPO_PATH: ${{ github.workspace }}/mailvault-contract
        run: npm run test:otp:integration
